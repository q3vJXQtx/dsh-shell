name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI (Windows / MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      - name: Frontend (tsc + vite build)
        run: npm run build

      - name: Rust tests (incl. capability guard)
        working-directory: src-tauri
        run: cargo test --lib

      - name: Release binary (custom-protocol)
        working-directory: src-tauri
        run: cargo build --release --features custom-protocol

  release:
    name: Installer & release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      - name: Tauri build (NSIS) & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: "DSH Shell ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false

      # tauri 官方没有 "portable" bundle 目标；但 tauri build 产出的
      # 裸 exe 本身就是可独立运行的便携版（应用会自动检测并进入便携模式）。
      # 这里把它改名后直接挂到同一个 Release 上。
      - name: Attach portable exe to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="DSH.Shell_${GITHUB_REF_NAME#v}_x64-portable.exe"
          cp src-tauri/target/release/dsh-shell.exe "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
